syntax = "proto3";
package fpa.v1;
import "google/protobuf/timestamp.proto";
// Public source snapshots. Retrieval times are not source-update timestamps.
service ResultsService {
 rpc Ping(PingRequest) returns (PingResponse);
 rpc ListSeasons(ListSeasonsRequest) returns (ListSeasonsResponse);
 rpc ListCompetitions(ListCompetitionsRequest) returns (ListCompetitionsResponse);
 rpc ListPhases(ListPhasesRequest) returns (ListPhasesResponse);
 rpc GetPhase(GetPhaseRequest) returns (GetPhaseResponse);
 rpc GetMatch(GetMatchRequest) returns (GetMatchResponse);
}
message PingRequest {}
message PingResponse { string message = 1; }
message Season { string id = 1; string name = 2; }
message Competition { string id = 1; string name = 2; string code = 3; }
message Phase { string id = 1; string name = 2; }
message ListSeasonsRequest {}
message ListSeasonsResponse { repeated Season seasons = 1; google.protobuf.Timestamp fetched_at = 2; }
message ListCompetitionsRequest { string season_id = 1; string association_id = 2; string gender = 3; }
message ListCompetitionsResponse { repeated Competition competitions = 1; google.protobuf.Timestamp fetched_at = 2; }
message ListPhasesRequest { string competition_id = 1; }
message ListPhasesResponse { repeated Phase phases = 1; google.protobuf.Timestamp fetched_at = 2; }
message GetPhaseRequest { string competition_id = 1; string phase_id = 2; }
// Source-local calendar date and time stay strings, without an invented UTC offset.
message Match {
 string id = 1; string number = 2; string date = 3; string time = 4;
 string home = 5; string away = 6;
 optional uint32 home_goals = 7; optional uint32 away_goals = 8;
 string venue = 9; string round = 10;
 string home_club_id = 11; string away_club_id = 12;
 // Opaque match-detail ESTADO; calendar JOGO_ESTADO_CODIGO is deliberately excluded.
 string source_state = 13;
}
message Standing {
 string team_id = 1; string name = 2;
 optional int32 position = 3; optional int32 points = 4;
 optional uint32 played = 5; optional uint32 wins = 6;
 optional uint32 draws = 7; optional uint32 losses = 8;
 optional uint32 goals_for = 9; optional uint32 goals_against = 10;
 optional int32 difference = 11;
}
message GetPhaseResponse { repeated Match matches = 1; repeated Standing standings = 2; google.protobuf.Timestamp fetched_at = 3; }
message GetMatchRequest { string match_id = 1; }
message Period { string name = 1; optional uint32 home = 2; optional uint32 away = 3; }
message Participant {
 string registration_number = 1; string name = 2; string shirt = 3;
 optional uint32 goals = 4; string role = 5;
 string yellow = 6; uint32 exclusions = 7; string disqualified = 8;
}
message GetMatchResponse {
 Match match = 1; repeated Period periods = 2;
 repeated Participant home_players = 3; repeated Participant away_players = 4;
 repeated string officials = 5; google.protobuf.Timestamp fetched_at = 6;
}
